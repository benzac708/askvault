# Dependency updates for the app and its CI actions. Security updates run via
# the same mechanism (dependabot_security_updates is enabled on the repo).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # Lockfile-only bumps are noise; let versions move within the locked set.
    versioning-strategy: "lockfile-only"
    ignore:
      # The pinned LLM/runtime pins are reviewed, not auto-bumped.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]